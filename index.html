<!doctype html><html lang="pt-BR"><head><meta charset=utf-8><title>MF Treinos</title><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
<style>
/* MF Treinos — visual "giz e anilhas": base clara de giz, grafite de piso emborrachado,
   e as cores das anilhas olímpicas (azul, vermelho, amarelo, verde) como sistema de destaque.
   O ponto marcante é a barra que vai sendo carregada de anilhas conforme o aluno marca os exercícios. */
:root{
  --chalk:#F6F2E8; --surface:#FFFDF7; --surface-2:#EDE6D3; --ink:#14213D; --muted:#566077; --line:#DAD2BC;
  --primary:#14213D; --on-primary:#F6F2E8; --primary-soft:#F8EBC4; --accent:#F2B72E; --on-accent:#14213D;
  --p-red:#F2B72E; --p-blue:#14213D; --p-yellow:#D9960A; --p-green:#3E5486;
  --steel:#9AA1B0; --ok:#1F7A4D; --danger:#B3261E; --bg:var(--chalk);
  --font:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --chalk:#0E1730; --surface:#15244A; --surface-2:#1D2E5C; --ink:#F4EFE2; --muted:#A9B3CB; --line:#2C3C6B;
    --primary:#F2B72E; --on-primary:#14213D; --primary-soft:#2A3A66; --accent:#F2B72E; --on-accent:#14213D;
    --p-blue:#F4EFE2; --p-green:#7F93C4; --steel:#6E7A99;
    --ok:#5FD39A; --danger:#FF8A80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --chalk:#0E1730; --surface:#15244A; --surface-2:#1D2E5C; --ink:#F4EFE2; --muted:#A9B3CB; --line:#2C3C6B;
    --primary:#F2B72E; --on-primary:#14213D; --primary-soft:#2A3A66; --accent:#F2B72E; --on-accent:#14213D;
    --p-blue:#F4EFE2; --p-green:#7F93C4; --steel:#6E7A99;
    --ok:#5FD39A; --danger:#FF8A80; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);border-top:5px solid var(--accent);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto;padding-block:12px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font);font-stretch:72%;font-weight:800;line-height:1;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:clamp(2.6rem,9vw,4.6rem);letter-spacing:-.02em}
h2{font-size:clamp(1.8rem,5vw,2.5rem)}
h3{font-size:1.3rem;line-height:1.15}
p{margin:0}
.eyebrow{font-size:.9rem;font-weight:600;color:var(--muted)}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* cabeçalho */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:8px 0 24px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-stretch:72%;font-size:1.4rem;letter-spacing:-.01em}
.logo{width:40px;height:40px;border-radius:12px;background:var(--ink);color:var(--chalk);display:grid;place-items:center;font-stretch:125%;font-weight:800;font-size:.85rem;flex:none;position:relative;overflow:hidden}
.logo::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--p-red) 0 25%,var(--p-blue) 25% 50%,var(--p-yellow) 50% 75%,var(--p-green) 75%)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;padding:.45rem 1.1rem;border-radius:999px;font-weight:700;font-size:.92rem;color:var(--muted);min-height:38px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,24,30,.12)}

/* botões */
.btn{border:0;background:var(--ink);color:var(--chalk);font-weight:700;padding:.7rem 1.25rem;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:46px;transition:transform .12s ease,background-color .15s}
.btn:active{transform:scale(.97)}
.btn.gold{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.danger{background:transparent;color:var(--danger);box-shadow:inset 0 0 0 1.5px currentColor}
.btn.sm{padding:.4rem .9rem;min-height:38px;font-size:.9rem}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.sticker{display:inline-block;background:var(--accent);color:var(--on-accent);font-weight:800;font-stretch:72%;font-size:1.05rem;padding:.25rem .8rem;border-radius:999px}

/* entrada */
.entry{display:flex;flex-direction:column;gap:14px}
.entry-card{background:#14213D;color:#F6F2E8;--ink:#F6F2E8;--muted:#C9CFDC;--steel:#56627F;--p-blue:#F6F2E8;--p-green:#8FA3D4;border-radius:28px;padding:clamp(28px,6vw,64px);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(24px,5vw,56px);align-items:center;min-height:420px;overflow:hidden}
.entry-copy{display:flex;flex-direction:column;gap:20px;align-items:flex-start}
.entry-card h1{max-width:11ch;color:#F2B72E}
.entry-card p{max-width:36ch;color:var(--muted);font-size:1.08rem}
.entry-card .btn{font-size:1.02rem;padding:.85rem 1.6rem;min-height:52px}
.hero-bar{width:100%;max-width:440px;justify-self:center}
.hero-bar svg{width:100%;height:auto;display:block;overflow:visible}
.hero-bar .pl{transform-box:fill-box;transform-origin:center;animation:load .55s cubic-bezier(.2,.9,.3,1.2) both}
.hero-bar .pl.l1,.hero-bar .pl.r1{animation-delay:.15s}.hero-bar .pl.l2,.hero-bar .pl.r2{animation-delay:.3s}
.hero-bar .pl.l3,.hero-bar .pl.r3{animation-delay:.45s}.hero-bar .pl.l4,.hero-bar .pl.r4{animation-delay:.6s}
@keyframes load{from{opacity:0;transform:translateX(var(--from,0)) scaleY(.6)}to{opacity:1;transform:none}}
.plink{font-size:.92rem;color:var(--muted);text-align:center}
.linkbtn{background:none;border:0;padding:.5rem .25rem;min-height:44px;color:var(--primary);font-weight:700;font-size:.92rem;text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--ink)}

/* personal */
.pv{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;align-items:start}
.side{display:flex;flex-direction:column;gap:12px;min-width:0;background:var(--surface);border-radius:22px;padding:18px;position:sticky;top:calc(12px + env(safe-area-inset-top,0px))}
.side>.eyebrow{font-weight:800;font-stretch:72%;font-size:1.25rem;color:var(--ink)}
.alist{display:flex;flex-direction:column;gap:4px;margin:0 0 6px;padding:0;list-style:none}
.aitem{width:100%;text-align:left;background:transparent;border:0;border-radius:14px;padding:.7rem .85rem;display:flex;flex-direction:column;gap:1px;transition:background-color .15s}
.aitem:hover{background:var(--surface-2)}
.aitem[aria-current="true"]{background:var(--primary-soft);box-shadow:inset 3px 0 0 var(--accent)}
.aitem b{font-weight:700} .aitem small{color:var(--muted);font-size:.85rem}
.addrow{display:flex;gap:8px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid transparent;border-radius:12px;padding:.6rem .8rem;min-height:46px;min-width:0;width:100%;transition:border-color .15s,background-color .15s}
input:hover{border-color:var(--line)}
input:focus,textarea:focus{outline:0;border-color:var(--primary);background:var(--surface)}
input::placeholder{color:var(--muted);opacity:.75}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.85rem;font-weight:600;color:var(--muted);min-width:0}
.side label.f:first-of-type{padding-top:12px;border-top:1px solid var(--line)}
.panel{background:var(--surface);border-radius:28px;padding:clamp(18px,3.5vw,32px);display:flex;flex-direction:column;gap:22px;min-width:0}
.rowb{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.rowb>div>.eyebrow{margin-bottom:4px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--bg);border-radius:18px;padding:14px 18px;min-width:140px}
.stat b{font-stretch:72%;font-size:2.4rem;font-weight:800;display:block;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:.88rem;color:var(--muted)}
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.tcard{border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;background:var(--bg);min-width:0}
.tcard>.rowb{flex-direction:column;gap:8px}
.tcard>.rowb>.muted{text-align:left!important}
.days{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:.8rem;font-weight:700;background:var(--surface);color:var(--ink);padding:.15rem .6rem;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--line)}
.exl{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;font-size:.95rem}
.exl li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.exl li span:last-child{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{background:var(--bg);border-radius:20px;padding:36px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.ex-tag{font-size:.72rem;font-weight:700;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:.05rem .5rem;margin-left:6px;vertical-align:middle}

/* editor */
.panel>div>.eyebrow,.edex>.eyebrow{font-weight:700;color:var(--ink)}
.dchips{display:flex;gap:6px;flex-wrap:wrap}
.dchip{border:0;background:var(--bg);border-radius:999px;padding:.35rem .95rem;font-weight:700;font-size:.92rem;min-height:42px;color:var(--muted)}
.dchip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.edex{display:flex;flex-direction:column;gap:12px}
.edrow{border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.edrow input{background:var(--surface)}
.edgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.edhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.edhead .num{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--chalk);display:grid;place-items:center;font-weight:800;font-size:1rem}

/* aluno */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{border:0;background:var(--bg);border-radius:16px;padding:.6rem 0;text-align:center;font-weight:700;font-size:.85rem;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:64px;color:var(--muted)}
.wd[disabled]{cursor:default;opacity:.55}
.wd i{width:7px;height:7px;border-radius:50%;background:transparent;display:block}
.wd.has{color:var(--ink)} .wd.has i{background:var(--accent)}
.wd.today{box-shadow:inset 0 0 0 2px var(--ink)}
.wd.sel{background:var(--primary);color:var(--on-primary)}
.wd.sel i{background:var(--on-primary)}
.tchips{display:flex;gap:8px;flex-wrap:wrap}
.tchip{border:0;background:var(--bg);border-radius:999px;padding:.5rem 1.1rem;font-weight:700;color:var(--muted);min-height:42px}
.tchip[aria-pressed="true"]{background:var(--ink);color:var(--chalk)}

/* barra de progresso em forma de barra olímpica */
.barbell{position:relative;display:flex;align-items:center;height:64px;padding-left:4px}
.barbell::before{content:"";position:absolute;left:0;right:0;top:50%;height:8px;margin-top:-4px;border-radius:4px;background:linear-gradient(180deg,var(--steel),var(--line))}
.barbell .collar{position:relative;flex:none;width:10px;height:22px;border-radius:3px;background:var(--steel);margin-right:4px}
.barbell .plates{position:relative;display:flex;align-items:center;gap:3px;flex:1;min-width:0}
.barbell .plate{flex:0 1 22px;min-width:6px;height:60px;border-radius:5px;box-shadow:inset 0 0 0 2px var(--line);background:var(--surface);transition:background-color .25s,box-shadow .25s,transform .25s}
.barbell .plate.on{box-shadow:none;transform:scaleY(1)}
.barbell .plate.c0.on{background:var(--p-red)} .barbell .plate.c1.on{background:var(--p-blue)}
.barbell .plate.c2.on{background:var(--p-yellow)} .barbell .plate.c3.on{background:var(--p-green)}
.barbell .plate:not(.on){transform:scaleY(.8)}

.ex{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.exb{width:100%;text-align:left;display:flex;gap:14px;align-items:flex-start;background:var(--bg);border:0;border-radius:20px;padding:16px;transition:background-color .2s}
.exb:hover{background:var(--surface-2)}
.chk{flex:none;width:32px;height:32px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--steel);display:grid;place-items:center;font-weight:800;color:transparent;margin-top:2px;transition:background-color .2s,box-shadow .2s}
.exb[aria-pressed="true"]{background:var(--primary-soft)}
.exb[aria-pressed="true"] .chk{background:var(--accent);box-shadow:none;color:var(--on-accent)}
.exb[aria-pressed="true"] .exn{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted)}
.exn{font-weight:800;font-stretch:80%;font-size:1.25rem;line-height:1.2}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.meta span{font-size:.86rem;font-weight:600;background:var(--surface);border-radius:999px;padding:.12rem .65rem;font-variant-numeric:tabular-nums}
.obs{font-size:.92rem;color:var(--muted);margin-top:8px}
.done{background:var(--ink);color:var(--chalk);border-radius:22px;padding:20px 22px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.done h3{font-size:1.6rem}
.done p{opacity:.8}
.done{border-top:5px solid var(--accent)}
.done h3{color:var(--accent)}
.done .btn{background:var(--accent);color:var(--on-accent)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--chalk);padding:.75rem 1.25rem;border-radius:999px;font-weight:700;max-width:calc(100% - 32px);z-index:10;box-shadow:0 8px 24px rgba(20,24,30,.25)}
.loading{padding:60px 0;text-align:center;color:var(--muted)}


/* login */
.auth-card .entry-copy{gap:16px;width:100%;max-width:380px}
.auth-card h2{color:#F2B72E}
.auth-card p{font-size:1rem}
.auth-card p b{color:#F6F2E8;white-space:nowrap}
.auth-form{display:flex;flex-direction:column;gap:14px;width:100%}
.auth-form .btn{width:100%;margin-top:4px}
.auth-card input{background:rgba(255,255,255,.07);color:#F6F2E8;border-color:rgba(246,242,232,.18)}
.auth-card input:hover{border-color:rgba(246,242,232,.35)}
.auth-card input:focus{border-color:#F2B72E;background:rgba(255,255,255,.1)}
.auth-card input::placeholder{color:#8F99B3}
.auth-card .linkbtn{color:#F2B72E;padding-left:0}
.auth-card .btn.ghost{color:#F6F2E8;box-shadow:inset 0 0 0 1.5px rgba(246,242,232,.3)}
.auth-erro{background:rgba(255,138,128,.14);color:#FFB4AB;border-radius:12px;padding:.6rem .8rem;font-size:.92rem}
.auth-card .hero-bar .pl{animation:none}
@media (max-width:760px){.auth-card .hero-bar{display:none}}
@media (max-width:760px){
  .entry-card{grid-template-columns:1fr;min-height:0;border-radius:24px}
  .hero-bar{order:-1;max-width:320px}
  .pv{grid-template-columns:minmax(0,1fr)}
  .side{position:static}
  .panel{border-radius:24px}
  .wd{font-size:.76rem;border-radius:12px}
  .tcards{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
  .hero-bar .pl{animation:none}
}

/* ===== acabamento moderno ===== */
:root{--shadow-sm:0 1px 2px rgba(20,33,61,.06),0 2px 8px -4px rgba(20,33,61,.12);--shadow:0 1px 2px rgba(20,33,61,.05),0 12px 32px -16px rgba(20,33,61,.28);--navy:#14213D;--gold:#F2B72E;--cream:#F6F2E8}
body{background:radial-gradient(1200px 500px at 85% -10%,rgba(242,183,46,.14),transparent 60%),var(--bg);background-attachment:fixed;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;margin:0 -16px 12px;padding:12px 16px;background:color-mix(in srgb,var(--chalk) 86%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4)}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#1F3263,var(--navy));color:var(--gold);box-shadow:var(--shadow-sm)}
:root[data-theme="dark"] .logo{background:linear-gradient(145deg,#2A3E73,#1A2A55)}
.seg{background:var(--surface);box-shadow:var(--shadow-sm)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--chalk);box-shadow:none}
.btn{transition:transform .12s ease,background-color .15s,box-shadow .2s,filter .15s}
.btn.gold{background:linear-gradient(180deg,#F7C64A,#EDAA16);box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 6px 16px -8px rgba(237,170,22,.8)}
.btn.gold:hover{filter:brightness(1.04);box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 10px 22px -10px rgba(237,170,22,.9)}

/* superfícies */
.side,.panel{box-shadow:var(--shadow);border:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.panel{--pad:clamp(18px,3.5vw,32px);padding:var(--pad)}
.tcard,.edrow{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm);transition:transform .2s ease,box-shadow .2s ease}
.tcard{position:relative;overflow:hidden;padding-top:22px}
.tcard::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--gold),#D9960A)}
.tcard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.stat{background:var(--surface);box-shadow:var(--shadow-sm)}

/* hero em azul-marinho com brilho dourado */
.entry-card,.phero{position:relative;overflow:hidden;isolation:isolate;
  background:radial-gradient(90% 120% at 100% 0%,rgba(242,183,46,.26),transparent 55%),radial-gradient(70% 110% at 0% 100%,rgba(70,96,160,.45),transparent 60%),#14213D}
.entry-card::before,.phero::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background-image:linear-gradient(rgba(246,242,232,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(246,242,232,.05) 1px,transparent 1px);background-size:32px 32px;
  -webkit-mask-image:radial-gradient(80% 90% at 70% 30%,#000,transparent);mask-image:radial-gradient(80% 90% at 70% 30%,#000,transparent)}
.entry-card{box-shadow:0 30px 60px -30px rgba(20,33,61,.6)}
.phero{--ink:#F6F2E8;--muted:#C2CADB;--surface:rgba(255,255,255,.08);--bg:rgba(255,255,255,.06);--line:rgba(246,242,232,.14);--chalk:#14213D;
  color:#F6F2E8;margin:calc(var(--pad)*-1 + 6px) calc(var(--pad)*-1 + 6px) 0;border-radius:24px;padding:calc(var(--pad) - 4px);display:flex;flex-direction:column;gap:20px}
.phero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.who{display:flex;gap:14px;align-items:center;min-width:0}
.who h2{color:#FFFFFF}
.kicker{font-size:.9rem;font-weight:700;color:var(--gold)}
.goal{display:inline-block;margin-top:8px;font-size:.85rem;font-weight:700;color:#F6F2E8;background:rgba(255,255,255,.1);border:1px solid rgba(246,242,232,.18);border-radius:999px;padding:.15rem .7rem}
.phero .stat{background:rgba(255,255,255,.07);box-shadow:none;border:1px solid rgba(246,242,232,.12);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.phero .stat b{color:var(--gold)}

function barra(f,tot){
  var s='';for(var i=0;i<tot;i++){s+='<span class="plate c'+(i%4)+(i<f?' on':'')+'"></span>';}
  return '<div class="barbell" role="progressbar" aria-label="Progresso do treino" aria-valuemin="0" aria-valuemax="'+tot+'" aria-valuenow="'+f+'"><span class="collar"></span><div class="plates">'+s+'</div></div>';
}

/* personal */
function personal(){
  if(S.sel&&!alunoPorId(S.sel))S.sel=null;
  if(!S.sel&&S.alunos.length)S.sel=S.alunos.slice().sort(function(a,b){return a.nome.localeCompare(b.nome);})[0].id;
  var side='<aside class="side"><div class="eyebrow">Seus alunos</div>';
  if(S.alunos.length){
    side+='<ul class="alist">'+S.alunos.slice().sort(function(a,b){return a.nome.localeCompare(b.nome);}).map(function(a){
      var n=treinosDe(a.id).length;
      return '<li><button class="aitem" data-act="selAluno" data-id="'+esc(a.id)+'" aria-current="'+(S.sel===a.id)+'"><span class="avatar">'+iniciais(a.nome)+'</span><span class="ainfo"><b>'+esc(a.nome)+(a.exemplo?'<span class="ex-tag">exemplo</span>':'')+'</b><small>'+n+(n===1?' treino':' treinos')+(a.objetivo?' · '+esc(a.objetivo):'')+'</small></span></button></li>';
    }).join('')+'</ul>';
  }
  side+='<label class="f">Novo aluno<input id="novo-nome" placeholder="Nome do aluno" autocomplete="off"></label>'+
    '<label class="f">Objetivo<input id="novo-obj" placeholder="Ex.: hipertrofia" autocomplete="off"></label>'+
    '<button class="btn gold" data-act="addAluno">Cadastrar aluno</button></aside>';

  var main;
  if(S.sel&&!alunoPorId(S.sel))S.sel=null;
  if(!S.sel&&S.alunos.length)S.sel=S.alunos[0].id;
  if(!S.alunos.length){
    main='<section class="panel"><div class="empty"><h2>Nenhum aluno ainda</h2><p class="muted">Cadastre o primeiro aluno ao lado para começar a montar treinos.</p></div></section>';
  } else if(S.importar){
    main=importView();
  } else if(S.editor){
    main=editor();
  } else {
    var a=alunoPorId(S.sel);
    var ts=treinosDe(a.id);
    main='<section class="panel"><div class="phero"><div class="phero-top"><div class="who"><span class="avatar lg">'+iniciais(a.nome)+'</span><div><div class="kicker">Aluno</div><h2>'+esc(a.nome)+'</h2>'+(a.objetivo?'<span class="goal">'+esc(a.objetivo)+'</span>':'')+'</div></div>'+
      '<div class="acts"><button class="btn ghost" data-act="abrirImport">Importar fichas</button><button class="btn gold" data-act="novoTreino">+ Novo treino</button></div></div>'+
      '<div class="stats"><div class="stat"><b>'+ts.length+'</b><span>'+(ts.length===1?'treino':'treinos')+'</span></div><div class="stat"><b>'+sessoes(a.id)+'</b><span>sessões concluídas</span></div></div></div>';
    if(!ts.length){
      main+='<div class="empty"><h3>Sem treinos para '+esc(a.nome.split(' ')[0])+'</h3><p class="muted">Crie o primeiro treino e escolha os dias da semana.</p><div class="acts" style="justify-content:center"><button class="btn" data-act="novoTreino">Criar treino</button><button class="btn ghost" data-act="abrirImport">Importar fichas A–D</button></div></div>';
    } else {
      main+='<div class="tcards">'+ts.map(function(t){return tcard(t);}).join('')+'</div>';
    }
    main+='<div class="acts">'+(S.confirm==='a:'+a.id?
      '<span class="muted">Excluir aluno e todos os treinos?</span><button class="btn danger sm" data-act="delAlunoYes" data-id="'+esc(a.id)+'">Sim, excluir</button><button class="btn ghost sm" data-act="cancelConfirm">Cancelar</button>':
      '<button class="btn ghost sm" data-act="delAlunoAsk" data-id="'+esc(a.id)+'">Excluir aluno</button>')+'</div></section>';
  }
  return '<div class="pv">'+side+main+'</div>';
}
function alunoPorId(id){return S.alunos.find(function(a){return a.id===id;});}
function tcard(t){
  var f=feitos(t),p=S.progresso[t.id],ses=(p&&p.sessoes)||0;
  return '<article class="tcard"><div class="rowb"><div><h3>'+esc(t.nome)+'</h3>'+
    '<div class="days" style="margin-top:6px">'+(t.dias.length?ORDEM.filter(function(d){return t.dias.indexOf(d)>-1;}).map(function(d){return '<span class="pill">'+DIAS[d]+'</span>';}).join(''):'<span class="muted">Sem dia definido</span>')+'</div></div>'+
    '<div class="muted" style="font-size:.85rem;text-align:right">'+f+'/'+t.exercicios.length+' feitos hoje<br>'+ses+(ses===1?' sessão concluída':' sessões concluídas')+'</div></div>'+
    '<ul class="exl">'+t.exercicios.map(function(e){return '<li><span>'+esc(e.nome)+'</span><span>'+esc(e.series)+'×'+esc(e.reps)+(e.carga?' · '+esc(e.carga)+' kg':'')+'</span></li>';}).join('')+'</ul>'+
    '<div class="acts">'+(S.confirm==='t:'+t.id?
      '<span class="muted">Excluir este treino?</span><button class="btn danger sm" data-act="delTreinoYes" data-id="'+esc(t.id)+'">Sim, excluir</button><button class="btn ghost sm" data-act="cancelConfirm">Cancelar</button>':
      '<button class="btn ghost sm" data-act="editTreino" data-id="'+esc(t.id)+'">Editar</button><button class="btn ghost sm" data-act="delTreinoAsk" data-id="'+esc(t.id)+'">Excluir</button>')+'</div></article>';
}
function abrirImport(){
  S.editor=null;S.confirm=null;
  S.importar={pular:true,fichas:FICHAS.map(function(f){return {nome:f.nome,dias:f.dias.slice(),incluir:true,exercicios:f.exercicios};})};
}
function nomesExistentes(alunoId){return treinosDe(alunoId).map(function(t){return (t.nome||'').trim().toLowerCase();});}
function importView(){
  var im=S.importar,a=alunoPorId(S.sel),ja=nomesExistentes(S.sel);
  var sel=im.fichas.filter(function(f){return f.incluir&&!(im.pular&&ja.indexOf(f.nome.toLowerCase())>-1);}).length;
  var h='<section class="panel"><div><div class="eyebrow">Importar fichas · '+esc(a?a.nome:'')+'</div><h2>Treinos A, B, C e D</h2>'+
    '<p class="muted" style="margin-top:6px">Confira os dias de cada treino e importe para este aluno. Depois você pode editar cargas e detalhes normalmente.</p></div>'+
    '<div class="imp-list">'+im.fichas.map(function(f,i){
      var existe=ja.indexOf(f.nome.toLowerCase())>-1;
      return '<article class="imp'+(f.incluir?'':' off')+'"><div class="rowb"><div><h3>'+esc(f.nome)+'</h3>'+
        '<p class="muted imp-ex">'+f.exercicios.length+' exercícios · '+esc(f.exercicios.map(function(e){return e.nome;}).join(', '))+'</p>'+
        (existe?'<span class="imp-tag">'+(im.pular?'Já existe · será pulado':'Já existe · será importado de novo')+'</span>':'')+'</div>'+
        '<button class="btn ghost sm" data-act="impIncluir" data-f="'+i+'" aria-pressed="'+f.incluir+'">'+(f.incluir?'Incluído':'Não incluir')+'</button></div>'+
        '<div class="dchips">'+ORDEM.map(function(d){return '<button class="dchip" data-act="impDia" data-f="'+i+'" data-d="'+d+'" aria-pressed="'+(f.dias.indexOf(d)>-1)+'"'+(f.incluir?'':' disabled')+'>'+DIAS[d]+'</button>';}).join('')+'</div></article>';
    }).join('')+'</div>'+
    '<div class="edgrid"><label class="f">Descanso padrão entre séries (s)<input id="imp-desc" inputmode="numeric" value="60"></label></div>'+
    '<button class="imp-check" data-act="impPular" aria-pressed="'+im.pular+'"><span class="box" aria-hidden="true">✓</span>Pular treinos que o aluno já tem com o mesmo nome</button>'+
    '<div class="acts"><button class="btn gold" data-act="fazerImport"'+(sel?'':' disabled')+'>Importar '+sel+(sel===1?' treino':' treinos')+'</button><button class="btn ghost" data-act="cancelImport">Cancelar</button></div></section>';
  return h;
}
function fazerImport(){
  var im=S.importar,alunoId=S.sel,ja=nomesExistentes(alunoId);
  var desc=String(Math.max(0,parseInt((($('#imp-desc')||{}).value),10)||0));
  var base=Date.now(),n=0,pulados=[];
  im.fichas.forEach(function(f,i){
    if(!f.incluir)return;
    if(im.pular&&ja.indexOf(f.nome.toLowerCase())>-1){pulados.push(f.nome);return;}
    var t={id:uid(),alunoId:alunoId,nome:f.nome,dias:f.dias.slice().sort(),criadoEm:base+i,
      exercicios:f.exercicios.map(function(e,j){return {id:'e'+(j+1),nome:e.nome,series:e.series,reps:e.reps,carga:'',descanso:desc,obs:e.obs};})};
    S.treinos.push(t);persist('treinos',t.id,strip(t));n++;
  });
  S.importar=null;
  toast(n+(n===1?' treino importado':' treinos importados')+(pulados.length?'. Já existiam: '+pulados.join(', '):'')+'.');
  render();
}

/* aluno */
function escolherAluno(){
  var h='<section class="panel"><div><div class="eyebrow">Bem-vindo</div><h2>Quem é você?</h2></div>';
  if(!S.alunos.length){
    h+='<div class="empty"><h3>Nenhum aluno cadastrado</h3><p class="muted">Peça ao seu personal para cadastrar você e volte aqui.</p></div>';
  } else {
    h+='<ul class="alist">'+S.alunos.slice().sort(function(a,b){return a.nome.localeCompare(b.nome);}).map(function(a){
      return '<li><button class="aitem" data-act="escolheAluno" data-id="'+esc(a.id)+'"><span class="avatar">'+iniciais(a.nome)+'</span><span class="ainfo"><b>'+esc(a.nome)+(a.exemplo?'<span class="ex-tag">exemplo</span>':'')+'</b><small>'+treinosDe(a.id).length+' treinos</small></span></button></li>';
    }).join('')+'</ul>';

function aluno(){
  var a=alunoAtual();
  if(!a)return semVinculo();
  var ts=treinosDe(a.id),hoje=new Date().getDay();
  var cur=ts.find(function(t){return t.id===S.selTreino;});
  if(!cur){cur=ts.find(function(t){return t.dias.indexOf(hoje)>-1;})||ts[0]||null;}
  S.selTreino=cur?cur.id:null;
  var treinoHoje=ts.find(function(t){return t.dias.indexOf(hoje)>-1;});
  var h='<section class="panel"><div class="phero"><div class="phero-top"><div class="who"><span class="avatar lg">'+iniciais(a.nome)+'</span><div><div class="kicker">Olá, '+esc(a.nome.split(' ')[0])+'</div>'+
    '<h2>'+(treinoHoje?'Hoje é dia de treino.':ts.length?'Seus treinos da semana.':'Seu treino vem aí.')+'</h2></div></div>'+
    '</div>';
  if(!ts.length){
    return h+'</div><div class="empty"><h3>Ainda sem treino</h3><p class="muted">Seu personal ainda não montou um treino para você. Assim que ele salvar, aparece aqui.</p></div></section>';
  }
  h+='<div class="week" aria-label="Semana">'+ORDEM.map(function(d){
    var t=ts.find(function(x){return x.dias.indexOf(d)>-1;});
    var sel=cur&&cur.dias.indexOf(d)>-1;
    return '<button class="wd'+(t?' has':'')+(d===hoje?' today':'')+(sel?' sel':'')+'" data-act="selDia" data-d="'+d+'"'+(t?'':' disabled')+' aria-label="'+DIAS[d]+(d===hoje?' (hoje)':'')+'">'+DIAS[d]+'<i></i></button>';
  }).join('')+'</div></div>';
  if(ts.length>1){
    h+='<div class="tchips">'+ts.map(function(t){return '<button class="tchip" data-act="selTreino" data-id="'+esc(t.id)+'" aria-pressed="'+(cur&&cur.id===t.id)+'">'+esc(t.nome)+'</button>';}).join('')+'</div>';
  }
  var f=feitos(cur),tot=cur.exercicios.length,p=S.progresso[cur.id],ses=(p&&p.sessoes)||0;
  var dias=ORDEM.filter(function(d){return cur.dias.indexOf(d)>-1;}).map(function(d){return DIAS[d];}).join(' · ');
  h+='<div class="rowb"><div><div class="eyebrow">'+(dias||'Treino')+'</div><h3 style="font-size:1.5rem">'+esc(cur.nome)+'</h3></div>'+(cur.dias.indexOf(hoje)>-1?'<span class="sticker">Hoje</span>':'')+'</div>'+
    '<div class="pcard"><div class="rowb"><span class="pnum"><b>'+f+'</b><span>/'+tot+'</span> exercícios feitos</span><span class="muted">'+ses+(ses===1?' sessão concluída':' sessões concluídas')+'</span></div>'+
    barra(f,tot)+'</div>'+
    '<ul class="ex">'+cur.exercicios.map(function(e,i){
      var on=p&&p.feitos&&p.feitos.indexOf(e.id)>-1;
      return '<li><button class="exb" data-act="toggleEx" data-t="'+esc(cur.id)+'" data-e="'+esc(e.id)+'" aria-pressed="'+(!!on)+'"><span class="chk" aria-hidden="true"><span class="n">'+(i+1)+'</span><span class="v">✓</span></span><span style="min-width:0"><span class="exn">'+esc(e.nome)+'</span>'+
        '<span class="meta" style="display:flex"><span>'+esc(e.series)+' séries</span><span>'+esc(fmtReps(e.reps))+'</span>'+(e.carga?'<span>'+esc(e.carga)+' kg</span>':'')+(e.descanso?'<span>'+esc(e.descanso)+' s descanso</span>':'')+'</span>'+
        (e.obs?'<span class="obs" style="display:block">'+esc(e.obs)+'</span>':'')+'</span></button></li>';
    }).join('')+'</ul>';
  if(tot&&f===tot){
    h+='<div class="done"><div><h3>Treino completo!</h3><p>Todos os exercícios feitos. Conclua para somar na sua conta.</p></div><button class="btn" data-act="concluir" data-t="'+esc(cur.id)+'">Concluir treino</button></div>';
  } else if(f>0){
    h+='<div class="acts"><button class="btn ghost sm" data-act="zerar" data-t="'+esc(cur.id)+'">Limpar marcações</button></div>';
  }
  return h+'</section>';
}

    var vin='';
    if(u.papel==='aluno'){
      vin='<label class="f">Cadastro de treinos<select data-uact="vinculo" data-uid="'+esc(u.id)+'">'+
        '<option value=""'+(u.alunoId?'':' selected')+'>Escolha o aluno…</option>'+

  }).join('')+'</ul></section>';

}

/* ---------- novo usuário com senha temporária ---------- */
function gerarSenha(){
  var A='ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789',r='';
  var buf=new Uint32Array(10);
  for(;;){
    crypto.getRandomValues(buf);r='';
    for(var i=0;i<buf.length;i++)r+=A[buf[i]%A.length];
    if(/\d/.test(r)&&/[A-Z]/.test(r)&&/[a-z]/.test(r))return r;
  }
}

function erroCriar(e){
  var c=(e&&e.code)||'';
  return ({'auth/email-already-in-use':'Já existe uma conta com este e-mail. Peça para a pessoa entrar no app: ela aparece nesta lista como pendente.',
    'auth/invalid-email':'E-mail inválido.',

    'auth/too-many-requests':'Muitas tentativas seguidas. Aguarde alguns minutos.',
    'auth/network-request-failed':'Sem conexão. Verifique a internet.'})[c]||('Não foi possível criar o usuário ('+(c||'erro desconhecido')+').');
}
async function criarUsuario(){
  var n=S.novo,nome=(($('#nu-nome')||{}).value||'').trim(),email=(($('#nu-email')||{}).value||'').trim().toLowerCase();
  if(!nome){n.erro='Digite o nome da pessoa.';S.focus='#nu-nome';render();return;}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){n.erro='Digite um e-mail válido.';S.focus='#nu-email';render();return;}
  n.busy=true;n.erro='';render();
  var senha=gerarSenha(),novoUid=null,sec=null;
  /* conta criada numa instância separada para não desconectar o administrativo */
  try{
    sec=initializeApp(firebaseConfig,'criar-'+Date.now());
    var secAuth=initializeAuth(sec,{persistence:inMemoryPersistence});
    var cred=await createUserWithEmailAndPassword(secAuth,email,senha);
    novoUid=cred.user.uid;
    try{await signOut(secAuth);}catch(e){}
  }catch(e){n.busy=false;n.erro=erroCriar(e);if(sec){try{await deleteApp(sec);}catch(x){}}render();return;}
  try{await deleteApp(sec);}catch(e){}
  var alunoId=null;
  if(n.papel==='aluno'){
    if(n.vinculo==='__novo'){var a={id:uid(),nome:nome,objetivo:'',criadoEm:Date.now()};S.alunos.push(a);persist('alunos',a.id,strip(a));alunoId=a.id;}
    else alunoId=n.vinculo||null;
  }
  try{
    await set(ref(rtdb,'usuarios/'+novoUid),{email:email,nome:nome,papel:n.papel,alunoId:alunoId,senhaTemporaria:true,criadoEm:Date.now(),criadoPor:S.me.uid});
  }catch(e){
    n.busy=false;n.erro='A conta foi criada, mas o perfil não foi salvo. A pessoa vai aparecer como pendente quando entrar. Senha temporária: '+senha;render();return;
  }
  S.criado={nome:nome,email:email,senha:senha,papel:n.papel};S.novo=null;render();
}
async function copiarAcesso(){
  if(!S.criado)return;
  var t=textoAcesso(S.criado);
  try{await navigator.clipboard.writeText(t);toast('Mensagem copiada. Cole no WhatsApp ou no e-mail.');}
  catch(e){
    var ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
    var ok=false;try{ok=document.execCommand('copy');}catch(x){}
    ta.remove();toast(ok?'Mensagem copiada.':'Não foi possível copiar. Selecione e copie os dados manualmente.');
  }
}

  else if(el.dataset.nact==='vinculo')S.novo.vinculo=el.value;

/* ---------- troca obrigatória da senha temporária ---------- */
function trocarSenhaView(){
  var c='<h2>Crie sua senha</h2><p>Você entrou com uma senha temporária. Crie uma senha só sua para continuar.</p>'+
    '<form class="auth-form" data-form="trocaSenha" novalidate>'+
    '<input type="email" autocomplete="username" value="'+esc(S.me.email)+'" hidden>'+
    '<label class="f">Nova senha<input id="ns-nova" type="password" autocomplete="new-password" placeholder="Mínimo de 8 caracteres"></label>'+
    '<label class="f">Repita a nova senha<input id="ns-conf" type="password" autocomplete="new-password"></label>'+
    (S.senhaErr?'<p class="auth-erro" role="alert">'+esc(S.senhaErr)+'</p>':'')+
    '<button type="submit" class="btn gold"'+(S.senhaBusy?' disabled':'')+'>'+(S.senhaBusy?'Salvando…':'Salvar senha e continuar')+'</button></form>'+
    '<button class="linkbtn" data-act="sair">Sair</button>';
  return '<section class="entry"><div class="entry-card auth-card"><div class="entry-copy">'+c+'</div>'+HERO+'</div></section>';
}
async function trocarSenha(){
  var a=(($('#ns-nova')||{}).value||''),b=(($('#ns-conf')||{}).value||'');
  if(a.length<8){S.senhaErr='A senha precisa ter pelo menos 8 caracteres.';render();return;}
  if(a!==b){S.senhaErr='As duas senhas não são iguais.';render();return;}
  S.senhaBusy=true;S.senhaErr='';render();
  try{
    await updatePassword(auth.currentUser,a);
    await set(ref(rtdb,'usuarios/'+S.me.uid+'/senhaTemporaria'),false);
    S.senhaBusy=false;toast('Senha criada. Bem-vindo ao MF Treinos!');
  }catch(e){
    S.senhaBusy=false;
    var c=(e&&e.code)||'';
    if(c==='auth/requires-recent-login'){toast('Por segurança, entre de novo com a senha temporária.');sair();return;}
    S.senhaErr=c==='auth/weak-password'?'Senha fraca. Use letras e números.':c==='auth/network-request-failed'?'Sem conexão. Verifique a internet.':'Não foi possível salvar a senha ('+(c||'erro')+').';
  }
  render();
}

/* ---------- render ---------- */
function render(){
  var app=$('#app');
  var saved={},active=document.activeElement&&document.activeElement.id||null,selS=null,selE=null;
  Array.prototype.forEach.call(app.querySelectorAll('input[id]'),function(el){saved[el.id]=el.value;});
  if(active&&document.activeElement.selectionStart!=null){selS=document.activeElement.selectionStart;selE=document.activeElement.selectionEnd;}
  var body;
  if(S.auth!=='ok')body=authView();
  else if(S.perfilStatus==='erro')body=erroPerfil();
  else if(S.perfilStatus!=='ok')body='<div class="loading">Carregando…</div>';
  else if(S.me.senhaTemporaria)body=trocarSenhaView();
  else if(S.me.papel==='pendente')body=pendenteView();
  else if(S.dbErro)body='<section class="panel"><div class="empty"><h2>Sem acesso aos dados</h2><p class="muted">Você entrou, mas o banco recusou o acesso. Confira as regras do Realtime Database no Firebase.</p><button class="btn" data-act="sair">Sair</button></div></section>';
  else if(!S.ready)body='<div class="loading">Carregando…</div>';
  else if(S.me.papel==='aluno')body=aluno();
  else if(S.me.papel==='admin'&&S.aba==='usuarios')body=usuariosView();
  else body=personal();
  app.innerHTML=header()+body;
  var vk=S.auth+'|'+(S.ready?1:0)+'|'+(S.me?S.me.papel:'')+S.aba+'|'+(S.editor?1:0)+(S.importar?'i':'')+'|'+S.sel+'|'+S.alunoId;
  if(vk!==render._k){render._k=vk;app.classList.add('enter');clearTimeout(render._t);render._t=setTimeout(function(){app.classList.remove('enter');},500);}
  Array.prototype.forEach.call(app.querySelectorAll('input[id]'),function(el){
    if(el.id in saved&&(el.id==='novo-nome'||el.id==='novo-obj'||/^(lg|imp|pf|nu|ns)-/.test(el.id))&&el.value!==saved[el.id])el.value=saved[el.id];
  });
  if(S.focus){var f=$(S.focus);if(f)f.focus();S.focus=null;}
  else if(active){var el=document.getElementById(active);if(el){el.focus();if(selS!=null){try{el.setSelectionRange(selS,selE);}catch(e){}}}}
}
var toastT=null;
function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true;},2800);}

/* ---------- events ---------- */
document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');if(!b||b.disabled)return;
  var act=b.dataset.act,d=b.dataset;
  switch(act){
    case 'aba':if(S.me&&S.me.papel==='admin'){S.aba=d.v;S.editor=null;S.importar=null;S.confirm=null;}break;
    case 'salvarNome':salvarNome();return;
    case 'novoUser':S.novo={papel:'aluno',vinculo:'__novo',busy:false,erro:''};S.criado=null;S.focus='#nu-nome';break;
    case 'cancelNovo':S.novo=null;break;
    case 'fecharCriado':S.criado=null;break;
    case 'copiarAcesso':copiarAcesso();return;
    case 'selAluno':S.sel=d.id;S.editor=null;S.importar=null;S.confirm=null;break;
    case 'addAluno':addAluno();return;
    case 'delAlunoAsk':S.confirm='a:'+d.id;break;
    case 'delAlunoYes':S.confirm=null;delAluno(d.id);break;
    case 'delTreinoAsk':S.confirm='t:'+d.id;break;
    case 'delTreinoYes':S.confirm=null;delTreino(d.id);break;
    case 'cancelConfirm':S.confirm=null;break;
    case 'novoTreino':S.importar=null;novoEditor(S.sel,null);S.focus='#ed-nome';break;
    case 'editTreino':novoEditor(S.sel,S.treinos.find(function(t){return t.id===d.id;}));break;
    case 'cancelEditor':S.editor=null;break;
    case 'saveEditor':saveEditor();return;
    case 'toggleDia':var i=S.editor.dias.indexOf(+d.d);if(i>-1)S.editor.dias.splice(i,1);else S.editor.dias.push(+d.d);break;
    case 'addEx':S.editor.exercicios.push(blankEx());S.focus='#ex-'+(S.editor.exercicios.length-1)+'-nome';break;
    case 'rmEx':S.editor.exercicios.splice(+d.i,1);if(!S.editor.exercicios.length)S.editor.exercicios.push(blankEx());break;
    case 'mvEx':var x=+d.i,y=x+(+d.dir),L=S.editor.exercicios;if(y>=0&&y<L.length){var tmp=L[x];L[x]=L[y];L[y]=tmp;}break;
    case 'selTreino':S.selTreino=d.id;break;
    case 'selDia':var t=treinosDe(S.alunoId).find(function(z){return z.dias.indexOf(+d.d)>-1;});if(t)S.selTreino=t.id;break;
    case 'toggleEx':toggleEx(d.t,d.e);break;
    case 'concluir':concluir(d.t);break;
    case 'zerar':zerar(d.t);break;
    case 'sair':sair();return;
    case 'esqueci':esqueci();return;
    case 'abrirImport':abrirImport();break;
    case 'cancelImport':S.importar=null;break;
    case 'impIncluir':var fi=S.importar.fichas[+d.f];fi.incluir=!fi.incluir;break;
    case 'impDia':var fd=S.importar.fichas[+d.f],k=fd.dias.indexOf(+d.d);if(k>-1)fd.dias.splice(k,1);else fd.dias.push(+d.d);break;
    case 'impPular':S.importar.pular=!S.importar.pular;break;
    case 'fazerImport':fazerImport();return;

  }
  render();
});

function iniciarDados(){
  if(unsubs.length)return;
  DB={ref:function(k){return {set:function(d){return set(ref(rtdb,k),d);},remove:function(){return remove(ref(rtdb,k));}};}};
  S.loaded={};S.ready=false;S.dbErro=false;
  function lista(v){return Object.keys(v||{}).map(function(k){var o=Object.assign({},v[k]);o.id=k;return o;});}
  function fail(){S.dbErro=true;render();}
  unsubs.push(onValue(ref(rtdb,'alunos'),function(s){S.alunos=lista(s.val());markLoaded('alunos');render();},fail));
  unsubs.push(onValue(ref(rtdb,'treinos'),function(s){
    S.treinos=lista(s.val()).map(function(t){t.dias=(t.dias||[]).map(Number);t.exercicios=t.exercicios||[];return t;});
    markLoaded('treinos');render();},fail));
  unsubs.push(onValue(ref(rtdb,'progresso'),function(s){
    var m={};lista(s.val()).forEach(function(o){m[o.id]={feitos:o.feitos||[],sessoes:o.sessoes||0};});
    S.progresso=m;markLoaded('progresso');render();},fail));
}
function pararDados(){
  unsubs.forEach(function(u){try{u();}catch(e){}});unsubs=[];DB=null;
  S.alunos=[];S.treinos=[];S.progresso={};S.ready=false;S.loaded={};S.dbErro=false;S.editor=null;
}
function markLoaded(k){S.loaded[k]=true;if(S.loaded.alunos&&S.loaded.treinos&&S.loaded.progresso)S.ready=true;}

var perfilUnsub=null,usuariosUnsub=null,criandoPerfil=false;
function pararPerfil(){if(perfilUnsub){try{perfilUnsub();}catch(e){}}perfilUnsub=null;S.me=null;S.perfilStatus=null;}
function pararUsuarios(){if(usuariosUnsub){try{usuariosUnsub();}catch(e){}}usuariosUnsub=null;S.usuarios=[];}
function iniciarUsuarios(){
  if(usuariosUnsub)return;
  usuariosUnsub=onValue(ref(rtdb,'usuarios'),function(s){
    var v=s.val()||{};S.usuarios=Object.keys(v).map(function(k){var o=Object.assign({},v[k]);o.id=k;return o;});render();
  },function(){usuariosUnsub=null;S.usuarios=[];toast('Não foi possível carregar a lista de usuários.');});
}
async function criarPerfil(user){
  if(criandoPerfil)return;criandoPerfil=true;
  var base={email:user.email||'',nome:'',criadoEm:Date.now()};
  var primeiro=false;
  /* o primeiro usuário do app vira administrativo; os demais entram como pendentes */
  try{var snap=await get(ref(rtdb,'usuarios'));primeiro=!snap.exists();}catch(e){primeiro=true;}
  try{
    var ok=false;
    if(primeiro){try{await set(ref(rtdb,'usuarios/'+user.uid),Object.assign({papel:'admin'},base));ok=true;}catch(e){}}
    if(!ok)await set(ref(rtdb,'usuarios/'+user.uid),Object.assign({papel:'pendente'},base));
  }catch(e){S.perfilStatus='erro';render();}
  criandoPerfil=false;
}
function aplicarPerfil(uidAtual,v){
  var papel=PAPEIS[v.papel]?v.papel:'pendente';
  S.me={uid:uidAtual,email:v.email||'',nome:v.nome||'',papel:papel,alunoId:v.alunoId||null,senhaTemporaria:!!v.senhaTemporaria};
  S.perfilStatus='ok';
  if(papel==='pendente'){pararDados();pararUsuarios();}
  else{
    iniciarDados();
    if(papel==='admin')iniciarUsuarios();else{pararUsuarios();S.aba='treinos';}
  }
  S.papel=papel==='aluno'?'aluno':papel==='pendente'?null:'personal';
  S.alunoId=papel==='aluno'?S.me.alunoId:null;
  render();
}
function avaliarUsuario(user){
  pararPerfil();pararUsuarios();
  if(!user){pararDados();S.auth='login';render();return;}
  S.auth='ok';S.authErr='';S.perfilStatus='loading';render();
  perfilUnsub=onValue(ref(rtdb,'usuarios/'+user.uid),function(snap){
    var v=snap.val();
    if(!v){criarPerfil(user);return;}
    aplicarPerfil(user.uid,v);
  },function(){S.perfilStatus='erro';render();});
}
async function salvarNome(){
  var n=(($('#pf-nome')||{}).value||'').trim();
  if(!n){toast('Digite seu nome.');return;}
  try{await set(ref(rtdb,'usuarios/'+S.me.uid+'/nome'),n);toast('Nome salvo.');}
  catch(e){toast('Não foi possível salvar o nome.');}
}
async function mudarPapel(uidAlvo,papel){
  var u=S.usuarios.find(function(x){return x.id===uidAlvo;});if(!u||uidAlvo===S.me.uid)return;
  var dados={papel:papel};
  if(papel==='aluno'){
    var al=u.alunoId&&alunoPorId(u.alunoId);
    if(!al){al=S.alunos.find(function(a){return a.nome.trim().toLowerCase()===nomeUsuario(u).trim().toLowerCase();});}
    dados.alunoId=al?al.id:null;
  } else dados.alunoId=null;
  try{await update(ref(rtdb,'usuarios/'+uidAlvo),dados);toast(nomeUsuario(u)+' agora é '+PAPEIS[papel]+'.');}
  catch(e){toast('Não foi possível mudar o perfil.');render();}
}
async function mudarVinculo(uidAlvo,alunoId){
  var u=S.usuarios.find(function(x){return x.id===uidAlvo;});if(!u)return;
  if(alunoId==='__novo'){
    var a={id:uid(),nome:nomeUsuario(u),objetivo:'',criadoEm:Date.now()};
    S.alunos.push(a);persist('alunos',a.id,strip(a));alunoId=a.id;
  }
  try{await update(ref(rtdb,'usuarios/'+uidAlvo),{alunoId:alunoId||null});toast('Cadastro de treinos ligado.');}
  catch(e){toast('Não foi possível ligar o cadastro.');render();}
}
document.addEventListener('change',function(ev){
  var el=ev.target;if(!el.dataset||!el.dataset.uact||!S.me||S.me.papel!=='admin')return;
  if(el.dataset.uact==='papel')mudarPapel(el.dataset.uid,el.value);
  else if(el.dataset.uact==='vinculo')mudarVinculo(el.dataset.uid,el.value);
});
async function fazerLogin(){
  var email=($('#lg-email').value||'').trim(),senha=$('#lg-senha').value||'';
  if(!email||!senha){S.authErr='Preencha e-mail e senha.';render();return;}
  S.authBusy=true;S.authErr='';render();
  try{await signInWithEmailAndPassword(auth,email,senha);}
  catch(e){S.authErr=msgErro(e);}
  S.authBusy=false;render();
}
async function esqueci(){
  var el=$('#lg-email'),email=el?(el.value||'').trim():'';
  if(!email){S.authErr='Digite seu e-mail no campo acima para receber o link.';render();return;}
  try{await sendPasswordResetEmail(auth,email);S.authErr='';toast('Se o e-mail estiver cadastrado, enviamos um link para redefinir a senha.');}
  catch(e){S.authErr=msgErro(e);}
  render();
}
async function sair(){
  S.authErr='';S.authBusy=false;pararPerfil();pararUsuarios();pararDados();S.aba='treinos';S.papel=null;S.alunoId=null;S.auth=CONFIG_OK?'login':'config';
  try{if(auth)await signOut(auth);}catch(e){}
  render();
}
document.addEventListener('submit',function(ev){
  var f=ev.target.dataset&&ev.target.dataset.form;
  if(f==='nome'){ev.preventDefault();salvarNome();return;}
  if(f==='novoUser'){ev.preventDefault();if(S.novo&&!S.novo.busy)criarUsuario();return;}
  if(f==='trocaSenha'){ev.preventDefault();if(!S.senhaBusy)trocarSenha();return;}
  if(f!=='login')return;
  ev.preventDefault();if(!S.authBusy)fazerLogin();
});

/* ---------- boot ---------- */
loadSession();
if(!CONFIG_OK){S.auth='config';render();}
else{
  app=initializeApp(firebaseConfig);auth=getAuth(app);auth.languageCode='pt-BR';rtdb=getDatabase(app);
  render();
  onAuthStateChanged(auth,avaliarUsuario);
}
})();
</script>

</body></html>
