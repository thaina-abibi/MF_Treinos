<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MF Treinos · Importar treinos</title>
<style>
:root{--bg:#F6F2E8;--surface:#fff;--ink:#14213D;--muted:#5B6478;--line:#D9D3C3;--navy:#14213D;--gold:#F2B72E;--ok:#2E7D4F;--err:#B3261E;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0E1628;--surface:#17223B;--ink:#F6F2E8;--muted:#AEB6C8;--line:#2B3858;--navy:#F6F2E8;--ok:#7FD39B;--err:#FF8A80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;border-top:5px solid var(--gold)}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 60px}
h1{margin:0 0 4px;font-size:1.7rem}
p.sub{margin:0 0 20px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.card h2{margin:0 0 12px;font-size:1.15rem}
label{display:block;font-weight:600;font-size:.9rem;margin:10px 0 4px}
input,select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
button{font:inherit;cursor:pointer}
.btn{min-height:46px;padding:0 18px;border-radius:999px;border:0;background:var(--gold);color:#14213D;font-weight:700;margin-top:14px}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.treino{border-top:1px solid var(--line);padding:12px 0}
.treino:first-of-type{border-top:0;padding-top:0}
.treino h3{margin:0 0 2px;font-size:1.05rem}
.treino .ex{color:var(--muted);font-size:.9rem;margin:0 0 8px}
.dias{display:flex;flex-wrap:wrap;gap:6px}
.dia{min-width:46px;min-height:36px;border-radius:999px;border:2px solid var(--line);background:transparent;color:var(--ink);font-weight:600;font-size:.85rem}
.dia[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--bg)}
.msg{margin-top:10px;font-weight:600}
.msg.ok{color:var(--ok)} .msg.err{color:var(--err)}
.hidden{display:none}
.check{display:flex;gap:8px;align-items:center;font-weight:500;margin-top:12px}
.check input{width:auto}
</style>
</head>
<body>
<div class="wrap">
  <h1>Importar treinos A, B, C e D</h1>
  <p class="sub">Envia os quatro treinos das fichas para um aluno do MF Treinos.</p>

  <section class="card" id="sLogin">
    <h2>1. Entrar</h2>
    <label for="email">E-mail</label>
    <input id="email" type="email" autocomplete="username">
    <label for="senha">Senha</label>
    <input id="senha" type="password" autocomplete="current-password">
    <button class="btn" id="bLogin">Entrar</button>
    <div class="msg" id="mLogin"></div>
  </section>

  <section class="card hidden" id="sAluno">
    <h2>2. Escolher o aluno</h2>
    <select id="aluno"></select>
    <div class="msg" id="mAluno"></div>
  </section>

  <section class="card hidden" id="sTreinos">
    <h2>3. Conferir os dias de cada treino</h2>
    <div id="lista"></div>
    <label for="descanso">Descanso padrão entre séries (segundos)</label>
    <input id="descanso" type="number" inputmode="numeric" value="60" min="0">
    <label class="check"><input type="checkbox" id="pular" checked> Pular treinos que o aluno já tem com o mesmo nome</label>
    <button class="btn" id="bEnviar">Enviar treinos</button>
    <button class="btn ghost" id="bSair">Sair</button>
    <div class="msg" id="mEnviar"></div>
  </section>
</div>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getDatabase,ref,get,push,set} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

const firebaseConfig={
  apiKey:'AIzaSyB0sUHBT_j71VPdouaRMIvz1-C-sry41U0',
  authDomain:'mf-treinos.firebaseapp.com',
  databaseURL:'https://mf-treinos-default-rtdb.firebaseio.com',
  projectId:'mf-treinos',
  storageBucket:'mf-treinos.firebasestorage.app',
  messagingSenderId:'334214461503',
  appId:'1:334214461503:web:1b84e3bcf87be8e28ba08a',
  measurementId:'G-SHLLFELYDM'
};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);

/* Treinos das fichas. reps com valores diferentes por série ficam separados por hífen. */
const X=(nome,series,reps,obs='')=>({nome,series:String(series),reps,obs});
const FICHAS=[
  {nome:'Treino A',dias:[1],exercicios:[
    X('Gêmeos sentado',4,'15'),
    X('Cadeira abdutora',4,'15'),
    X('Agachamento livre',4,'12'),
    X('Búlgaro no Smith',3,'12','Com step à frente'),
    X('Coice na polia / recuo',3,'15','Com step à frente'),
    X('Abdução na polia',3,'10'),
    X('Mesa flexora',4,'12')]},
  {nome:'Treino B',dias:[2],exercicios:[
    X('Remada baixa',4,'12'),
    X('Remada curvada',4,'12-15','Barra, pegada supinada'),
    X('Crucifixo na máquina',4,'12'),
    X('Supino inclinado',4,'8-10-12-15','Com halter, carga progressiva'),
    X('Tríceps francês',4,'15'),
    X('Rosca direta',4,'15'),
    X('Abdominal remador',4,'20'),
    X('Prancha tocando o ombro',4,'30')]},
  {nome:'Treino C',dias:[3],exercicios:[
    X('Agachamento hack',4,'12-15'),
    X('Leg press',4,'12'),
    X('Cadeira extensora',3,'15'),
    X('Cadeira abdutora',4,'15'),
    X('Búlgaro',3,'10'),
    X('Elevação pélvica',3,'15'),
    X('Panturrilha em pé',5,'20')]},
  {nome:'Treino D',dias:[4],exercicios:[
    X('Desenvolvimento',3,'10','Drop set'),
    X('Elevação frontal',4,'12'),
    X('Elevação lateral',4,'8'),
    X('Pull down',4,'12'),
    X('Puxada aberta',4,'12'),
    X('Supino reto na máquina',4,'10'),
    X('Burpee',4,'15'),
    X('Prancha isométrica',4,'1 min')]}
];
const DIAS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const $=id=>document.getElementById(id);
const msg=(id,t,cls='')=>{const m=$(id);m.textContent=t;m.className='msg '+cls;};

function renderLista(){
  $('lista').innerHTML=FICHAS.map((f,i)=>`
    <div class="treino">
      <h3>${f.nome}</h3>
      <p class="ex">${f.exercicios.map(e=>e.nome).join(', ')}</p>
      <div class="dias">${DIAS.map((d,n)=>`<button class="dia" data-f="${i}" data-d="${n}" aria-pressed="${f.dias.includes(n)}">${d}</button>`).join('')}</div>
    </div>`).join('');
}
$('lista').addEventListener('click',ev=>{
  const b=ev.target.closest('.dia');if(!b)return;
  const f=FICHAS[+b.dataset.f],d=+b.dataset.d;
  f.dias=f.dias.includes(d)?f.dias.filter(x=>x!==d):[...f.dias,d].sort();
  b.setAttribute('aria-pressed',f.dias.includes(d));
});

async function carregarAlunos(){
  msg('mAluno','Carregando alunos…');
  try{
    const snap=await get(ref(db,'alunos'));
    const v=snap.val()||{};
    const ids=Object.keys(v).sort((a,b)=>(v[a].nome||'').localeCompare(v[b].nome||''));
    if(!ids.length){$('aluno').innerHTML='';msg('mAluno','Nenhum aluno cadastrado. Cadastre o aluno no MF Treinos e recarregue esta página.','err');return;}
    $('aluno').innerHTML=ids.map(id=>`<option value="${id}">${v[id].nome||id}</option>`).join('');
    msg('mAluno','');
    $('sTreinos').classList.remove('hidden');
  }catch(e){msg('mAluno','Não foi possível ler os alunos: '+e.message,'err');}
}

onAuthStateChanged(auth,u=>{
  $('sLogin').classList.toggle('hidden',!!u);
  $('sAluno').classList.toggle('hidden',!u);
  if(!u)$('sTreinos').classList.add('hidden');
  if(u){renderLista();carregarAlunos();}
});

$('bLogin').addEventListener('click',async()=>{
  msg('mLogin','Entrando…');
  try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('senha').value);msg('mLogin','');}
  catch(e){msg('mLogin','E-mail ou senha incorretos.','err');}
});
$('senha').addEventListener('keydown',e=>{if(e.key==='Enter')$('bLogin').click();});
$('bSair').addEventListener('click',()=>signOut(auth));

$('bEnviar').addEventListener('click',async()=>{
  const alunoId=$('aluno').value;
  if(!alunoId){msg('mEnviar','Escolha um aluno.','err');return;}
  const descanso=String(Math.max(0,parseInt($('descanso').value,10)||0));
  $('bEnviar').disabled=true;msg('mEnviar','Enviando…');
  try{
    const snap=await get(ref(db,'treinos'));
    const existentes=Object.values(snap.val()||{}).filter(t=>t.alunoId===alunoId).map(t=>(t.nome||'').trim().toLowerCase());
    let enviados=0,pulados=[];
    for(const [i,f] of FICHAS.entries()){
      if($('pular').checked&&existentes.includes(f.nome.toLowerCase())){pulados.push(f.nome);continue;}
      await set(push(ref(db,'treinos')),{
        alunoId,nome:f.nome,dias:f.dias,criadoEm:Date.now()+i,
        exercicios:f.exercicios.map((e,j)=>({id:'e'+(j+1),nome:e.nome,series:e.series,reps:e.reps,carga:'',descanso,obs:e.obs}))
      });
      enviados++;
    }
    const nome=$('aluno').selectedOptions[0].textContent;
    msg('mEnviar',`${enviados} treino(s) enviados para ${nome}.`+(pulados.length?` Já existiam: ${pulados.join(', ')}.`:''),'ok');
  }catch(e){msg('mEnviar','Falha ao enviar: '+e.message,'err');}
  finally{$('bEnviar').disabled=false;}
});
</script>
</body>
</html>
